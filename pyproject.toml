[project]
name = "cloudidesandbox"
version = "0.1.0"
description = ""
authors = [
    {name = "Ruslan",email = "pprrg18@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "docker (>=7.1.0,<8.0.0)",
    "websockets (>=16.1,<17.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.19.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "redis (>=8.1.0,<9.0.0)",
]

[tool.poetry]
packages = [{include = "cloudidesandbox", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)"
]
